<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスクリスト</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="auth" hidden>
    <h1>タスクリスト</h1>

    <form id="login-form" hidden>
      <label>ユーザー名
        <input id="login-username" type="text" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>PIN
        <input id="login-pin" type="password" inputmode="numeric" pattern="\d{4,8}" autocomplete="current-password" required>
      </label>
      <button type="submit">ログイン</button>
    </form>

    <form id="setup-form" hidden>
      <p class="lead">はじめに、あなたのアカウントを作成します。</p>
      <label>ユーザー名（半角英数字）
        <input id="setup-username" type="text" pattern="[a-zA-Z0-9_\-]{2,20}" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>表示名
        <input id="setup-name" type="text" maxlength="50" required>
      </label>
      <label>PIN（4〜8 桁の数字）
        <input id="setup-pin" type="password" inputmode="numeric" pattern="\d{4,8}" autocomplete="new-password" required>
      </label>
      <button type="submit">作成して始める</button>
    </form>

    <p id="auth-error" class="error" role="alert"></p>
  </section>

  <main id="app" hidden>
    <header>
      <h1>タスクリスト</h1>
      <span id="me"></span>
      <button id="open-settings" type="button">設定</button>
    </header>

    <form id="new-task">
      <input id="title" type="text" placeholder="新しいタスク" maxlength="500" required autocomplete="off">
      <div class="row">
        <select id="assignee" aria-label="担当者"></select>
        <span id="new-task-tags"></span>
        <input id="due" type="date" aria-label="期限">
        <button type="submit">追加</button>
      </div>
    </form>

    <div id="filters">
      <nav id="status-filter">
        <button data-filter="active" class="selected">未完了</button>
        <button data-filter="done">完了済み</button>
        <button data-filter="all">すべて</button>
      </nav>
      <div class="selects">
        <select id="assignee-filter" aria-label="担当者で絞り込み"></select>
        <select id="tag-filter" aria-label="タグで絞り込み"></select>
      </div>
    </div>

    <ul id="tasks"></ul>
    <p id="empty" hidden>タスクはありません</p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <dialog id="settings">
    <form method="dialog" class="dialog-head">
      <h2>設定</h2>
      <button aria-label="閉じる">×</button>
    </form>

    <section>
      <h3>メンバー</h3>
      <ul id="member-list" class="settings-list"></ul>
      <form id="new-member" class="add-form">
        <input id="member-username" type="text" placeholder="ユーザー名（半角英数字）" pattern="[a-zA-Z0-9_\-]{2,20}" autocapitalize="none" required>
        <input id="member-name" type="text" placeholder="表示名" maxlength="50" required>
        <input id="member-pin" type="password" placeholder="最初の PIN" inputmode="numeric" pattern="\d{4,8}" autocomplete="new-password" required>
        <button type="submit">追加</button>
      </form>
      <p class="note">追加した人には、ユーザー名と最初の PIN を伝えてください。ログイン後に自分で PIN を変更できます。</p>
    </section>

    <section>
      <h3>タグ</h3>
      <ul id="tag-list" class="settings-list"></ul>
      <form id="new-tag" class="add-form">
        <input id="tag-name" type="text" placeholder="タグ名（例: 仕事）" maxlength="30" required>
        <select id="tag-color" aria-label="色"></select>
        <button type="submit">追加</button>
      </form>
    </section>

    <section>
      <h3>自分の PIN を変更</h3>
      <form id="change-pin" class="add-form">
        <input id="current-pin" type="password" placeholder="現在の PIN" inputmode="numeric" autocomplete="current-password" required>
        <input id="new-pin" type="password" placeholder="新しい PIN（4〜8 桁）" inputmode="numeric" pattern="\d{4,8}" autocomplete="new-password" required>
        <button type="submit">変更</button>
      </form>
    </section>

    <section>
      <button id="logout" type="button" class="logout">ログアウト</button>
    </section>
  </dialog>

  <template id="task-template">
    <li>
      <input type="checkbox" class="toggle">
      <div class="body">
        <span class="title" tabindex="0" title="ダブルクリックで編集"></span>
        <div class="meta">
          <select class="assignee" aria-label="担当者"></select>
          <span class="progress"></span>
          <span class="tags"></span>
          <input type="date" class="due" aria-label="期限">
        </div>
      </div>
      <button class="delete" aria-label="削除">×</button>
    </li>
  </template>

  <script src="/app.js" type="module"></script>
</body>
</html>
